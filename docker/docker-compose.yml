services:
  stockage:
    image: chrislusf/seaweedfs:latest
    container_name: fraude-stockage
    profiles: ["core"]
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=2048
    ports:
      - "${S3_PORT}:8333"
      - "${S3_FILER_PORT}:8888"
      - "${S3_MASTER_PORT}:9333"
    volumes:
      - stockage-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - fraude

volumes:
  stockage-data:
    name: fraude-stockage-data

networks:
  fraude:
    name: fraude-reseau
    driver: bridge
